name: Validar imagens publicadas AUTEC
on:
  push:
    branches: ["codex/recuperar-imagens-20260917"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Instalar verificador de imagens
        run: python -m pip install Pillow==11.3.0
      - name: Validar páginas e imagens no site público
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, io, json, re, time, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, quote
          from PIL import Image
          base = "https://autecsolutions.com.br/"
          pages = ["index.html","automacao-industrial.html","casas-inteligentes.html","cftv.html","nr12.html","paineis-eletricos.html","projetos-eletricos.html"]
          def fetch(url):
              request = urllib.request.Request(quote(url, safe=":/?=&%#"), headers={"User-Agent":"AUTEC image check","Cache-Control":"no-cache"})
              with urllib.request.urlopen(request,timeout=45) as response:
                  return response.read(), response.headers.get("Content-Type","")
          for attempt in range(18):
              try:
                  data, mime = fetch(base + "assets/images/sources.json")
                  manifest = json.loads(data)
                  assert len(manifest["images"]) == 19
                  break
              except Exception:
                  if attempt == 17: raise
                  time.sleep(10)
          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=="img" and attrs.get("src"):self.urls.append(attrs["src"])
                  if tag=="link" and attrs.get("rel")=="icon":self.urls.append(attrs["href"])
          urls=set()
          for page in pages:
              html = fetch(base+page)[0].decode("utf-8")
              assert "images.unsplash.com/" not in html, page + " still serves old image URLs"
              parser=Images();parser.feed(html)
              parser.urls += re.findall(r"url\(\s*['\"]?([^)'\"\s]+)",html)
              urls.update(urljoin(base,u) for u in parser.urls)
          def verify(url):
              binary, mime=fetch(url)
              assert mime.startswith("image/"), (url,mime)
              with Image.open(io.BytesIO(binary)) as im:im.verify()
              return url
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              checked=list(pool.map(verify,sorted(urls)))
          for entry in manifest["images"]:
              binary,mime=fetch(base+entry["path"])
              assert hashlib.sha256(binary).hexdigest()==entry["sha256"],entry["path"]
          print("AUTEC_LIVE_CHECK="+json.dumps({"pages":len(pages),"image_urls":len(checked),"optimized_images":len(manifest["images"]),"all_images_valid":True}))
          
          PY
